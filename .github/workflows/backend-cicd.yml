name: Backend CI/CD Pipeline

on:
  push:
    branches:
      - main
    paths:
      - "backend/**"
      - ".github/workflows/backend-cicd.yml"

permissions:
  contents: read
  packages: write

env:
  IMAGE: ${{secrets.IMAGE_NAME}}

jobs:
  build-and-push:
    name: Build and push image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup QEMU (cross-builds)
        uses: docker/setup-qemu-action@v2

      - name: Setup docker buildx
        uses: docker/setup-buildx-action@v2
      
      - name: Login to GHCR
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ secrets.GHCR_USERNAME }}
          password: ${{ secrets.GHCR_PAT }}

      - name: Build and Push image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha, mode=max

      - name: Waiting for some seconds for registery (small buffer)
        run: sleep 3
      
  deploy:
    name: Deploy to VM via SSH
    runs-on: ubuntu-latest
    needs: build-and-push
    steps:
      - name: SSH to remote and update container
        uses: appleboy/ssh-action@v0.1.8
        with:
          host: ${{secrets.SSH_HOST}}
          username: ${{secrets.SSH_USER}}
          port: ${{secrets.SSH_PORT || 22 }}
          key: ${{secrets.SSH_PRIVATE_KEY}}
          script: |
            set -e

            IMAGE=${{env.IMAGE}}:latest
            COMPOSE_DIR="${{secrets.REMOTE_COMPOSE_DIR}}"

            echo "Logging into GHCR from remote..."
            echo "${{secrets.GHCR_PAT}}" | docker login ghcr.io -u "${{secrets.GHCR_USERNAME }}" --password-stdin

            echo "Pulling image: $IMAGE"
            docker pull "$IMAGE" || true

            cd "$COMPOSE_DIR"

            echo "Pulling service images via docker-compose..."
            docker-compose pull backend  || true

            echo "Bringing up backend service..."
            docker-compose up -d --no-deps --force-recreate backend

            echo "Prune unused images..."
            docker image prune -f || true

            echo "Deployed successfully"

